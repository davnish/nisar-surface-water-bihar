# L07: supervised classifiers on a feature stack. Labels = S2 reference on TRAIN blocks (5 asc dates);
# 25% of train blocks are held out as VAL for the probability threshold and model selection; TEST untouched.
# Features: px = HH/HV/ratio; tex = + local mean/std/min (5x5, 15x15); full = + temporal stats over all 15
# asc dates (reference-free) + HAND. lgbm_full_mmu25 adds the C2 post-processing.
# Iteration 2: iteration 1 (lgbm_full, test F1 0.828) under-mapped monsoon water (S1 agreement 0.48 on 09-24)
# because monsoon water is 3-5 dB brighter. *_rel features = HH features minus the scene's tiled-KI threshold.
# rf_full / lgbm_px dropped (iteration 1 results kept in its run folder); *_nohand = production candidate.
id: L07_supervised_rf_lgbm
question: Does a supervised RF/LightGBM on multi-feature stacks beat the best unsupervised method?
task: water_mask
data:
  band: L
  granules:
  - NISAR_L2_PR_GCOV_006_098_A_014_4005_DHDH_A_20251128T233812_20251128T233847_X05009_N_F_J_001
