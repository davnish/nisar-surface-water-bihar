# F01 (Tasks B-S, C, F): L-only vs S-only vs L+S on the 8 asc 98/14 dates where NISAR acquired L- and S-band
# simultaneously (2026-07-14 .. 10-18; identical time and geometry, so only the frequency differs).
# S-band: Bhoonidhi NISAR_SSAR_GCOV, mode 3700 DHNA (HH/HV, 10 m), bbox windows streamed by HTTP range requests.
# Same pipeline per band (Lee 7x7 own ENL, dB, texture, own scene threshold), same samples, blocks and classifier.
# Only 2026-10-18 has an S2 reference (50 % clear): labels and test scores come from that date alone;
# all 8 dates are compared with S1 (consistency). Fusion = feature-level stacking in one LightGBM.
id: F01_L_S_fusion
question: Does combining NISAR L- and S-band GCOV improve water mapping over L-only and S-only, under identical conditions?
task: water_mask
