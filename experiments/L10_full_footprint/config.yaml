# L10: full-frame production (asc 98/14, 15 dates) with the L07 production model (lgbm_rel_nohand_mmu25).
# Tiles of 2048 px (~20 km, the bbox scale the model was trained at) with a 32 px halo; per-tile scene threshold
# for the relative features (fallback: the date's bbox C1 threshold); output 20 m (every 2nd 10 m sample).
# Smoke test 2026-11-09 (01-15 only, 4 tiles around the bbox, lgbm_rel_tex): bbox test-block F1 0.802 vs 0.823 in L07.
# Iteration 2 (2026-11-10): run 20261110-051412 showed (1) a ~10 km strip of near-zero power (-146 dB) at the
# far-range swath edge that the GCOV mask layer marks valid, plus a ~7 km backscatter ramp towards it -> all
# water; (2) 20 km tiles where tiled KI split the land histogram at ~-10 dB (dry season) -> speckled false water.
# Fixes: edge_mask (drop pixels within 10 km of near-zero power) and tile thresholds regularised from run 1's
# table (outliers > 3 dB from the date median and fallback tiles -> median of kept tiles within 2 tiles).
# Post-fix (run 20261110-144223): water fraction was still 0.31 -> 0.05 over the first 6-8 km inside the 10 km
# buffer, so scripts/l10_edge_postfix.py widened the east edge by 8 km on the 5 dry dates (same as buffer_m 18000,
# set below for any rerun).
# Iteration 3 (2026-11-10, L13): vs a frame-wide S2 mosaic (01-15) run 20261110-144223 over-mapped the southern
# plain (F1 0.29) and 2026-06-20 (7x S1): per-tile KI thresholds in low-water tiles split land types (~-14.9 dB vs
# -16.4 dB in the floodplain belt). All tiles now use the date's reference-box threshold (the one the model was
# trained against) minus 1 dB (selected on L13 tuning tiles; eval tiles: south F1 0.26 -> 0.41, belt 0.79 -> 0.79,
# 06-20 belt 7.2x -> 1.0x S1). Run in 5 shards (extra.shard) merged with extra.merge_shards; identical to one run.
