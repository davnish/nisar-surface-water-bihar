# L08 (Task H): full-pol L-band (desc 120/76 QPDH, frequency A 20 m, 10 covariance terms) vs dual-pol subsets.
# Same dates, geometry, samples, split and classifier for every feature set, so only the channels differ.
# Covariance terms boxcar 3x3 at 20 m (60 m window) before decompositions; features replicated onto the 10 m grid.
# 4 dates have an S2 reference (11-30, 01-05, 01-17, 06-22); 09-14 (monsoon) is compared with S1 only.
id: L08_polarimetric_features
question: Do polarimetric descriptors (H/A/alpha, decompositions, co-pol ratio) improve on the dual-pol baseline?
task: water_mask
data:
  band: L
  granules:
  - NISAR_L2_PR_GCOV_006_120_D_076_2005_QPDH_A_20251130T125101_20251130T125136_X05010_F_F_J_001
  - NISAR_L2_PR_GCOV_009_120_D_076_2005_QPDH_A_20260105T125103_20260105T125137_X05009_N_F_J_001
  - NISAR_L2_PR_GCOV_010_120_D_076_2005_QPDH_A_20260117T125104_20260117T125138_X05010_N_F_J_001
  - NISAR_L2_PR_GCOV_023_120_D_076_2005_QPDH_A_20260622T125103_20260622T125137_P05023_N_F_J_001
  - NISAR_L2_PR_GCOV_030_120_D_076_2005_QPDH_A_20260914T125059_20260914T125134_P05023_N_F_J_001
  frequency: frequencyA
  terms:
  - HHHH
  - HHHV
  - HHVH
  - HHVV
  - HVHV
  - HVVH
  - HVVV
  - VHVH
  - VHVV
  - VVVV
  extent: bbox
preprocess:
  speckle:
    name: boxcar
    size: 3
validation:
  reference: data/reference/s2_water_{date}.tif
  split: test
extra:
  features: polsar
  separability: true
  plot_date: '2026-01-17'
  compare_reference: data/reference/s1_water_{date}.tif
  stack:
    texture: true
  val_fraction: 0.25
  block_px: 200
  samples_per_date: 150000
  variants:
  - name: B_HH_tiled_mmu25
    method: threshold
    params:
      kind: tiled
      feature: HH
      tiled:
        tile: 256
        n_tiles: 10
        method: ki
        bounded: true
    refine:
      mmu_px: 25
  - name: B_HH_tuned
    method: threshold
    params:
      kind: tuned
      feature: HH
  - name: lgbm_HH
    method: supervised
    params:
      model: lgbm
      features:
      - HH
  - name: lgbm_dual
    method: supervised
    params:
      model: lgbm
      features:
      - HH
      - HV
      - HV-HH
  - name: lgbm_copol
    method: supervised
    params:
      model: lgbm
      features:
      - HH
      - VV
      - VV-HH
      - copol_coh
      - copol_phase_deg
  - name: lgbm_full
    method: supervised
    params:
      model: lgbm
      features:
      - HH
      - HV
      - HV-HH
      - VV
      - VV-HH
      - HV-VV
      - span
      - copol_coh
      - copol_phase_deg
      - H
      - A
      - alpha_deg
      - pauli_surface
      - pauli_double
      - pauli_volume
      - fd_surface_frac
      - fd_double_bounce_frac
      - fd_volume_frac
  - name: lgbm_dual_tex
    method: supervised
    params:
      model: lgbm
      features:
      - HH
      - HV
      - HV-HH
      - HH_m5
      - HH_s5
      - HH_m15
      - HH_s15
      - HH_min15
      - HV_m15
  - name: lgbm_full_tex
    method: supervised
    params:
      model: lgbm
      features:
      - HH
      - HV
      - HV-HH
      - VV
      - VV-HH
      - HV-VV
      - span
      - copol_coh
      - copol_phase_deg
      - H
      - A
      - alpha_deg
      - pauli_surface
      - pauli_double
      - pauli_volume
      - fd_surface_frac
      - fd_double_bounce_frac
      - fd_volume_frac
      - HH_m5
      - HH_s5
      - HH_m15
      - HH_s15
      - HH_min15
      - HV_m15
