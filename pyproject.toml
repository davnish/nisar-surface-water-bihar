[project]
name = "nisar-water"
version = "0.1.0"
description = "Surface-water mapping and change detection from NISAR L2 GCOV (InGARSS 2026 YP Hackathon)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "h5py>=3.10",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "rasterio>=1.3.9",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "earthaccess>=0.11",
    "asf-search>=8.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "tabulate>=0.10.0",
    "h5netcdf>=1.8.1",
    "pysheds>=0.5",
]

[project.scripts]
nisar-water = "nisar_water.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nisar_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
